[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "os3stack"
version = "0.1.0"
description = "Reference focus-stacking implementation (Step 1 benchmark) and supporting tools for OS3 Focus-Stacking"
readme = "README.md"
requires-python = ">=3.11"
# GPL-3.0, matching OpenScan3/OpenScan3-Client (see ../LICENSE at the repo
# root). An SPDX expression here, not a file reference: setuptools refuses
# to package a license file from outside this project's own directory.
license = "GPL-3.0-only"
# OpenCV is pinned to the exact version Pyodide ships (pyodide 314.0.7 ->
# opencv-python 4.11.0.86), because every browser path is compared against
# this reference: OpenCV 5.0 already merges ~11 % of pixels differently from
# 4.11 on the same input (measured 2026-10-19). OS3 on the Pi uses a 4.x
# system package too. Move this pin only together with the client's Pyodide.
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless==4.11.0.86",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
os3stack = "os3stack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
